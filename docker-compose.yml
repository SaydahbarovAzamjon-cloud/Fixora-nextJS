services:
  fixora-next:
    container_name: fixora-next
    restart: unless-stopped
    image: node:20.20.0
    ports:
      - 4000:3000
    volumes:
      - .:/usr/src/fixora-next
    working_dir: /usr/src/fixora-next
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
    command: bash scripts/docker-start.sh
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 120s

# fixora-next: localhost:4000 <=> container:3000
# fixora-api:   localhost:4001 (backend — alohida Fixora/docker-compose.yml)
# Deploy:       bash deploy.sh
