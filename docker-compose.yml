services:
  fixora-next: # Asl frontend — Fixora-nextJS (to'liq UI)
    container_name: fixora-next
    restart: always
    image: node:20.20.0
    ports:
      - 4000:3000 # Host 4000 → Next.js 3000
    volumes:
      - ../Fixora-nextJS:/usr/src/fixora-next # Desktop/Fixora-nextJS papkasi
    working_dir: /usr/src/fixora-next
    networks:
      - client-network
    environment:
      - NEXT_PUBLIC_GRAPHQL_URL=http://localhost:4001/graphql
      - NEXT_PUBLIC_API_URL=http://localhost:4001
      - NEXT_PUBLIC_WS_URL=ws://localhost:4001
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=210052577423-g9plsbb4gssvikh0o037627gcn2q0ha2.apps.googleusercontent.com
      - NEXT_PUBLIC_KAKAO_JS_KEY=4e8f5aca7f2f47ebbad077465304b388
    # FOR PRODUCTION
    command: bash -c "yarn && yarn run build && yarn run start"

networks:
  client-network:
    driver: bridge

























# fixora-next: localhost:4000 <=> container:3000  (Fixora-nextJS — to'liq UI)
# fixora-api:   localhost:4001 <=> container:2000
# fixora-batch: localhost:4002 <=> container:3001
